{{ partial "header.html" . }}

<header>
  <!-- <img id="mark" src="images/jk.png"> -->
  <h1 class="remove-bottom">Jonathan Keane, PhD</h1>
</header>
<hr class="large">
<div class="doc-section clearfix" id="intro">
{{ .Content }}
</div>
{{ range .Pages }}
{{ if .IsPage }}
<hr>
<div class="doc-section clearfix" id="{{ .Title }}">
  <a href="{{ .RelPermalink }}">
  {{ if .Params.full_title }}
  <h2>{{ .Params.full_title }}</h2>
  {{ else }}
  <h2>{{ .Title }}</h2>
  {{ end }}
  </a>
  <div class="spacer"></div>
  {{ .Summary }}
  <div class="read-more-link"><a href="{{ .RelPermalink }}">more →</a></div>
</div>
{{ end }}
{{ end }}

{{ partial "footer.html" . }}
