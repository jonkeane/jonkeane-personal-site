{{- $published := .Date.Format "2006-01-02" -}}
{{- $updated := .Lastmod.Format "2006-01-02" -}}
<div class="post-dates">
  <time class="post-date-published" datetime="{{ $published }}" aria-label="Published on {{ $published }}">{{ $published }}</time>
  {{ if gt $updated $published }}
    <span class="post-date-updated">updated&nbsp;<time datetime="{{ $updated }}">{{ $updated }}</time></span>
  {{ end }}
</div>
